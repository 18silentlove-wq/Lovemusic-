
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>LOVE MUSIC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090909;color:white;font-family:Arial,sans-serif;min-height:100vh;padding-bottom:35px}
header{height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.logo span{color:#ff3155}
button{cursor:pointer;border:0;color:white}
.add{background:#ff3155;padding:11px 15px;border-radius:25px;font-weight:bold}
main{max-width:850px;margin:auto;padding:22px 17px}
.hero{background:linear-gradient(120deg,#270c16,#111 75%);border:1px solid #3b1722;border-radius:20px;padding:28px 22px;margin-bottom:25px}
.hero small{color:#ff7890;letter-spacing:3px}
.hero h1{font-size:35px;margin:12px 0}
.hero p{color:#aaa;font-size:14px}
.section-title{font-size:19px;margin:25px 0 14px}
.track{background:#151515;border:1px solid #252525;border-radius:13px;padding:13px;display:flex;align-items:center;gap:13px;margin-bottom:10px}
.cover{width:48px;height:48px;flex-shrink:0;border-radius:10px;background:linear-gradient(135deg,#ff3155,#47101e);display:grid;place-items:center;font-size:22px}
.info{flex:1;min-width:0}
.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.info small{display:block;color:#888;margin-top:5px}
.play{background:#282828;width:38px;height:38px;border-radius:50%;font-size:16px}
.empty{text-align:center;padding:30px 12px;color:#888;background:#141414;border-radius:14px}
.player{position:fixed;bottom:0;left:0;width:100%;background:#181818;border-top:1px solid #333;padding:12px 16px 15px;z-index:5}
.now{display:flex;align-items:center;gap:12px;max-width:850px;margin:auto}
.nowinfo{flex:1;min-width:0}
.nowinfo b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowinfo small{font-size:11px;color:#888}
.controls{display:flex;align-items:center;gap:13px}
.controls button{background:none;font-size:20px}
#mainPlay{background:#ff3155;width:39px;height:39px;border-radius:50%;font-size:16px}
.progress{width:100%;max-width:850px;display:block;margin:10px auto 0;accent-color:#ff3155}
input[type=file]{display:none}
@media(min-width:600px){main{padding-top:30px}.hero{padding:40px}.hero h1{font-size:45px}}
</style>
</head>
<body>

<header>
  <div class="logo">LOVE <span>MUSIC</span></div>
  <button class="add" onclick="document.getElementById('files').click()">＋ Add Songs</button>
  <input id="files" type="file" accept="audio/*" multiple>
</header>

<main>
  <section class="hero">
    <small>YOUR MUSIC SPACE</small>
    <h1>Feel Every Beat.</h1>
    <p>Your music. Your mood. Your world.</p>
  </section>

  <h2 class="section-title">Your Library</h2>
  <div id="list">
    <div class="empty">🎵<br><br>No songs added yet.<br>Tap Add Songs to choose music from your device.</div>
  </div>
</main>

<div class="player">
  <div class="now">
    <div class="cover">♫</div>
    <div class="nowinfo">
      <b id="songName">No song playing</b>
      <small id="status">Choose a song to begin</small>
    </div>
    <div class="controls">
      <button onclick="previous()">|◀</button>
      <button id="mainPlay" onclick="togglePlay()">▶</button>
      <button onclick="next()">▶|</button>
    </div>
  </div>
  <input class="progress" id="progress" type="range" min="0" max="100" value="0">
</div>

<audio id="audio"></audio>

<script>
const audio=document.getElementById("audio");
const files=document.getElementById("files");
const list=document.getElementById("list");
const songName=document.getElementById("songName");
const statusText=document.getElementById("status");
const mainPlay=document.getElementById("mainPlay");
const progress=document.getElementById("progress");

let songs=[];
let current=0;

files.addEventListener("change",()=>{
  const selected=[...files.files];
  selected.forEach(file=>{
    songs.push({
      name:file.name.replace(/\.[^/.]+$/,""),
      url:URL.createObjectURL(file)
    });
  });
  render();
  if(songs.length && audio.paused) loadSong(songs.length-selected.length);
  files.value="";
});

function render(){
  if(!songs.length){
    list.innerHTML='<div class="empty">🎵<br><br>No songs added yet.<br>Tap Add Songs to choose music from your device.</div>';
    return;
  }
  list.innerHTML="";
  songs.forEach((song,index)=>{
    const item=document.createElement("div");
    item.className="track";
    const cover=document.createElement("div");
    cover.className="cover";
    cover.textContent="♫";
    const info=document.createElement("div");
    info.className="info";
    const name=document.createElement("b");
    name.textContent=song.name;
    const sub=document.createElement("small");
    sub.textContent="Your Library";
    info.append(name,sub);
    const play=document.createElement("button");
    play.className="play";
    play.textContent="▶";
    play.onclick=()=>loadSong(index);
    item.append(cover,info,play);
    list.append(item);
  });
}

function loadSong(index){
  if(!songs.length)return;
  current=(index+songs.length)%songs.length;
  audio.src=songs[current].url;
  songName.textContent=songs[current].name;
  statusText.textContent="Now Playing";
  audio.play().then(()=>{
    mainPlay.textContent="Ⅱ";
  }).catch(()=>{
    statusText.textContent="Tap play to start";
    mainPlay.textContent="▶";
  });
}

function togglePlay(){
  if(!songs.length)return;
  if(!audio.src){loadSong(current);return;}
  if(audio.paused){
    audio.play();
    mainPlay.textContent="Ⅱ";
    statusText.textContent="Now Playing";
  }else{
    audio.pause();
    mainPlay.textContent="▶";
    statusText.textContent="Paused";
  }
}

function next(){
  if(songs.length)loadSong(current+1);
}
function previous(){
  if(songs.length)loadSong(current-1);
}

audio.addEventListener("ended",next);
audio.addEventListener("timeupdate",()=>{
  if(audio.duration){
    progress.value=(audio.currentTime/audio.duration)*100;
  }
});
progress.addEventListener("input",()=>{
  if(audio.duration){
    audio.currentTime=(progress.value/100)*audio.duration;
  }
});
</script>
</body>
</html>
